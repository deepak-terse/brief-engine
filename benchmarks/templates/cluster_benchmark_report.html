<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cluster Benchmark Report</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #6b7280;
      --ok: #16a34a;
      --warn: #d97706;
      --bad: #dc2626;
      --accent: #2563eb;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
      color: var(--text);
      padding: 24px;
    }
    h1, h2 { margin: 0 0 8px 0; }
    .muted { color: var(--muted); }
    .run-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: center;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 14px 20px;
      margin: 12px 0 20px;
      font-size: 14px;
    }
    .run-summary .stat { display: flex; flex-direction: column; gap: 2px; }
    .run-summary .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8; }
    .run-summary .stat-value { font-size: 22px; font-weight: 700; color: #f1f5f9; }
    .run-summary .divider { width: 1px; height: 40px; background: #334155; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 16px 0 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .kpi-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .kpi-value { font-size: 28px; font-weight: 700; margin-top: 4px; }
    .th-help {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .help-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .help-icon {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      cursor: help;
      background: #fff;
    }
    .help-tip {
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      transform: translateX(-50%);
      min-width: 220px;
      max-width: 320px;
      background: #111827;
      color: #f9fafb;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
      z-index: 20;
      text-align: left;
      white-space: normal;
    }
    .help-tip::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 6px solid #111827;
    }
    .help-wrap:hover .help-tip,
    .help-wrap:focus-within .help-tip {
      opacity: 1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }
    th {
      background: #f8fafc;
      font-weight: 600;
    }
    tr:last-child td { border-bottom: 0; }
    .bar {
      height: 8px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
      width: 160px;
    }
    .fill {
      height: 100%;
      background: var(--accent);
    }
    .category-section {
      margin-top: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .tag { padding: 4px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); }
    .good { color: var(--ok); border-color: #bbf7d0; background: #f0fdf4; }
    .mid { color: var(--warn); border-color: #fde68a; background: #fffbeb; }
    .bad { color: var(--bad); border-color: #fecaca; background: #fef2f2; }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: var(--accent); }
    ul { margin: 8px 0 0 18px; }
  </style>
</head>
<body>
  <h1>Cluster Benchmark Report</h1>
  <p class="muted" id="meta"></p>

  <div class="run-summary" id="run-summary"></div>

  <div class="card" id="summary" style="margin: 12px 0 20px;"></div>

  <div class="grid" id="kpis"></div>

  <h2>Category Metrics</h2>
  <table>
    <thead id="metrics-head"></thead>
    <tbody id="rows"></tbody>
  </table>

  <h2 style="margin-top:20px;">Cluster vs Baseline Details</h2>
  <div id="details"></div>

  <script>
    const report = __REPORT_JSON_PAYLOAD__;

    function pct(v) {
      return `${(v * 100).toFixed(1)}%`;
    }
    function sec(v) {
      return `${Number(v || 0).toFixed(3)}s`;
    }

    function scoreClass(v) {
      if (v >= 0.85) return "good";
      if (v >= 0.7) return "mid";
      return "bad";
    }

    document.getElementById("meta").textContent =
      `Generated: ${report.generated_at} | Baseline snapshot: ${report.baseline_generated_at}`;

    const aggregate = report.aggregate || {};
    const categories = report.categories || {};
    const details = document.getElementById("details");

    // ── Run summary ribbon ─────────────────────────────────────────────────
    (function () {
      const stats = [
        { label: "Total Articles",      value: aggregate.total_article_count ?? "—" },
        { label: "Baseline Clusters",   value: aggregate.baseline_cluster_count ?? "—" },
        { label: "Predicted Clusters",  value: aggregate.predicted_cluster_count ?? "—" },
        { label: "Categories",          value: aggregate.category_count ?? "—" },
        { label: "Run Time",            value: sec(report.runtime_seconds) },
        { label: "Distance Threshold",  value: report.cluster_distance_threshold ?? "—" },
      ];
      const el = document.getElementById("run-summary");
      stats.forEach(({ label, value }, i) => {
        if (i > 0) {
          const div = document.createElement("div");
          div.className = "divider";
          el.appendChild(div);
        }
        const stat = document.createElement("div");
        stat.className = "stat";
        stat.innerHTML = `<span class="stat-label">${label}</span><span class="stat-value">${value}</span>`;
        el.appendChild(stat);
      });
    })();

    // ── KPI cards ──────────────────────────────────────────────────────────
    const kpiDefs = [
      { label: "Pairwise F1",       key: "avg_pairwise_f1",       fmt: pct },
      { label: "Pairwise Precision",key: "avg_pairwise_precision", fmt: pct },
      { label: "Pairwise Recall",   key: "avg_pairwise_recall",    fmt: pct },
      { label: "Mean Purity",       key: "mean_purity",            fmt: pct },
      { label: "Coverage Rate",     key: "coverage_rate",          fmt: pct },
      { label: "Singleton Rate",    key: "singleton_rate",         fmt: pct },
      { label: "Cluster Ratio",     key: "cluster_count_ratio",    fmt: (v) => `${Number(v).toFixed(2)}x` },
      { label: "Categories Run",    key: "category_count",         fmt: (v) => String(v) },
    ];
    const kpisEl = document.getElementById("kpis");
    for (const { label, key, fmt } of kpiDefs) {
      const val = aggregate[key] ?? null;
      const div = document.createElement("div");
      div.className = "card";
      const numVal = Number(val ?? 0);
      let colorClass = "";
      if (key.includes("f1") || key.includes("purity") || key.includes("coverage") || key.includes("precision") || key.includes("recall")) {
        colorClass = numVal >= 0.85 ? "good" : numVal >= 0.7 ? "mid" : "bad";
      }
      if (key === "singleton_rate") {
        colorClass = numVal >= 0.6 ? "bad" : numVal >= 0.3 ? "mid" : "good";
      }
      div.innerHTML = `
        <div class="kpi-label">${label}</div>
        <div class="kpi-value${colorClass ? ' ' + colorClass : ''}">${val !== null ? fmt(val) : "N/A"}</div>
      `;
      kpisEl.appendChild(div);
    }

    // ── Outcome summary card ───────────────────────────────────────────────
    function summarizeOutcomes() {
      const values = Object.keys(categories).sort().map((k) => ({ code: k, ...categories[k] }));
      if (!values.length) {
        return `
          <h3 style="margin:0 0 8px;">Outcome Summary</h3>
          <p class="muted" style="margin:0;">No category results available.</p>
        `;
      }

      const pairwiseF1 = values.map((c) => Number(c.pairwise_f1 || 0));
      const avgPairwiseF1 = pairwiseF1.reduce((a, b) => a + b, 0) / pairwiseF1.length;
      const minPairwiseF1 = Math.min(...pairwiseF1);
      const maxPairwiseF1 = Math.max(...pairwiseF1);
      const worst = values
        .slice()
        .sort((a, b) => Number(a.pairwise_f1 || 0) - Number(b.pairwise_f1 || 0))
        .slice(0, Math.min(3, values.length))
        .map((c) => `${c.code} (${pct(c.pairwise_f1 || 0)})`);

      const underClustered = values.filter((c) => {
        const expected = Number(c.expected_pair_count || 0);
        const predicted = Number(c.predicted_pair_count || 0);
        if (expected <= 0) return false;
        return (predicted / expected) < 0.85;
      }).map((c) => c.code);

      const overClustered = values.filter((c) => {
        const expected = Number(c.expected_pair_count || 0);
        const predicted = Number(c.predicted_pair_count || 0);
        if (expected <= 0) return false;
        return (predicted / expected) > 1.15;
      }).map((c) => c.code);

      const precisionValues = values.map((c) => Number(c.pairwise_precision || 0));
      const recallValues = values.map((c) => Number(c.pairwise_recall || 0));
      const avgPairwisePrecision = precisionValues.reduce((a, b) => a + b, 0) / precisionValues.length;
      const avgPairwiseRecall = recallValues.reduce((a, b) => a + b, 0) / recallValues.length;
      const qualityLabel = avgPairwiseF1 >= 0.85 ? "strong" : (avgPairwiseF1 >= 0.7 ? "moderate" : "weak");
      const avgPairRatio = values
        .map((c) => {
          const expected = Number(c.expected_pair_count || 0);
          const predicted = Number(c.predicted_pair_count || 0);
          return expected > 0 ? (predicted / expected) : 1.0;
        })
        .reduce((a, b) => a + b, 0) / values.length;

      const lines = [];
      lines.push(`Overall clustering quality is <strong>${qualityLabel}</strong> based on avg Pairwise F1 of <strong>${pct(avgPairwiseF1)}</strong> (range ${pct(minPairwiseF1)} to ${pct(maxPairwiseF1)}).`);
      lines.push(`Average Pairwise Precision is <strong>${pct(avgPairwisePrecision)}</strong> and Pairwise Recall is <strong>${pct(avgPairwiseRecall)}</strong>.`);
      lines.push(`Lowest-performing categories by Pairwise F1: <strong>${worst.join(", ")}</strong>.`);
      lines.push(
        underClustered.length
          ? `Likely <strong>under-clustering</strong> (predicted pairs below baseline): <strong>${underClustered.join(", ")}</strong>.`
          : `No clear under-clustering signal by pair-count ratio threshold (<code>0.85x</code>).`
      );
      lines.push(
        overClustered.length
          ? `Likely <strong>over-clustering</strong> (predicted pairs above baseline): <strong>${overClustered.join(", ")}</strong>.`
          : `No clear over-clustering signal by pair-count ratio threshold (> <code>1.15x</code>).`
      );

      // Deterministic action suggestions
      const threshold = Number(report.cluster_distance_threshold || 0.55);
      const actions = [];
      if (avgPairRatio < 0.85 && avgPairwisePrecision >= 0.85) {
        actions.push(
          `Increase grouping leniency: raise <code>CLUSTER_DISTANCE_THRESHOLD</code> from <code>${threshold}</code> to <code>${(threshold + 0.05).toFixed(2)}</code>. Why: predicted pairs are below baseline while precision is high — under-clustering.`
        );
      } else if (avgPairRatio > 1.15 && avgPairwisePrecision < 0.80) {
        actions.push(
          `Decrease grouping leniency: lower <code>CLUSTER_DISTANCE_THRESHOLD</code> from <code>${threshold}</code> to <code>${(threshold - 0.05).toFixed(2)}</code>. Why: predicted pairs exceed baseline and precision is lower — over-clustering.`
        );
      }
      if (avgPairwiseF1 < 0.75) {
        actions.push(
          `Run a threshold sweep: test <code>CLUSTER_DISTANCE_THRESHOLD</code> in <code>[${[threshold-0.1, threshold-0.05, threshold, threshold+0.05, threshold+0.1].map(v=>Math.max(0,v).toFixed(2)).join(", ")}]</code> and pick the value with highest average Pairwise F1.`
        );
      }
      if (!actions.length) {
        actions.push(
          `No immediate threshold change indicated. Keep <code>CLUSTER_DISTANCE_THRESHOLD=${threshold}</code> and re-evaluate after the next baseline refresh.`
        );
      }

      return `
        <h3 style="margin:0 0 8px;">Outcome Summary</h3>
        <ul style="margin:0 0 0 18px;">
          ${lines.map((line) => `<li>${line}</li>`).join("")}
        </ul>
        <h3 style="margin:14px 0 8px;">Action Items (Deterministic)</h3>
        <ol style="margin:0 0 0 20px;">
          ${actions.map((a) => `<li style="margin-bottom:6px;">${a}</li>`).join("")}
        </ol>
      `;
    }

    document.getElementById("summary").innerHTML = summarizeOutcomes();

    // ── Category metrics table ─────────────────────────────────────────────
    document.getElementById("metrics-head").innerHTML = `
      <tr>
        <th>Category</th>
        <th><span class="th-help">Articles <span class="help-wrap"><span class="help-icon">i</span><span class="help-tip">Unique article titles in the baseline for this category / matched in predicted clusters.</span></span></span></th>
        <th><span class="th-help">Pairwise F1 <span class="help-wrap"><span class="help-icon">i</span><span class="help-tip">Harmonic mean of pairwise precision and recall. Higher is better. Measures how well article co-cluster groupings are preserved.</span></span></span></th>
        <th><span class="th-help">Pair Precision <span class="help-wrap"><span class="help-icon">i</span><span class="help-tip">Fraction of predicted co-cluster pairs that also appear in the baseline.</span></span></span></th>
        <th><span class="th-help">Pair Recall <span class="help-wrap"><span class="help-icon">i</span><span class="help-tip">Fraction of baseline co-cluster pairs that were successfully reproduced.</span></span></span></th>
        <th><span class="th-help">Expected Pairs <span class="help-wrap"><span class="help-icon">i</span><span class="help-tip">Number of co-cluster article pairs in the baseline.</span></span></span></th>
        <th><span class="th-help">Predicted Pairs <span class="help-wrap"><span class="help-icon">i</span><span class="help-tip">Number of co-cluster article pairs produced by the current algorithm run.</span></span></span></th>
        <th><span class="th-help">Baseline Clusters <span class="help-wrap"><span class="help-icon">i</span><span class="help-tip">Number of clusters in the baseline snapshot.</span></span></span></th>
        <th><span class="th-help">Generated Clusters <span class="help-wrap"><span class="help-icon">i</span><span class="help-tip">Number of clusters produced by this benchmark run.</span></span></span></th>
        <th><span class="th-help">Singleton Rate <span class="help-wrap"><span class="help-icon">i</span><span class="help-tip">Fraction of generated clusters with only one member. High values indicate over-splitting.</span></span></span></th>
      </tr>
    `;

    const rows = document.getElementById("rows");
    for (const code of Object.keys(categories).sort()) {
      const c = categories[code];
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${code}</strong></td>
        <td>${c.baseline_article_count ?? 0} / ${c.predicted_article_count ?? 0}</td>
        <td>
          <div>${pct(c.pairwise_f1 || 0)}</div>
          <div class="bar"><div class="fill" style="width:${Math.max(0, Math.min(100, (c.pairwise_f1 || 0)*100))}%"></div></div>
        </td>
        <td>${pct(c.pairwise_precision || 0)}</td>
        <td>${pct(c.pairwise_recall || 0)}</td>
        <td>${c.expected_pair_count ?? 0}</td>
        <td>${c.predicted_pair_count ?? 0}</td>
        <td>${c.baseline_cluster_count ?? 0}</td>
        <td>${c.generated_cluster_count ?? 0}</td>
        <td>${pct(c.singleton_rate || 0)}</td>
      `;
      rows.appendChild(tr);

      // ── Per-category detail section ──────────────────────────────────────
      const section = document.createElement("section");
      section.className = "category-section";
      section.innerHTML = `
        <h3>${code}</h3>
        <div class="tags">
          <span class="tag">Articles (baseline): ${c.baseline_article_count ?? 0}</span>
          <span class="tag">Articles (predicted): ${c.predicted_article_count ?? 0}</span>
          <span class="tag ${scoreClass(c.pairwise_f1 || 0)}">Pairwise F1: ${pct(c.pairwise_f1 || 0)}</span>
          <span class="tag">Pair Precision: ${pct(c.pairwise_precision || 0)}</span>
          <span class="tag">Pair Recall: ${pct(c.pairwise_recall || 0)}</span>
          <span class="tag">Expected Pairs: ${c.expected_pair_count ?? 0}</span>
          <span class="tag">Predicted Pairs: ${c.predicted_pair_count ?? 0}</span>
          <span class="tag">Baseline Clusters: ${c.baseline_cluster_count ?? 0}</span>
          <span class="tag">Generated Clusters: ${c.generated_cluster_count ?? 0}</span>
          <span class="tag">Singleton Rate: ${pct(c.singleton_rate || 0)}</span>
        </div>
      `;

      const baselineClusters = c.baseline_clusters || [];
      const generatedClusters = c.generated_clusters || [];

      // Cluster mapping table
      const d0 = document.createElement("details");
      d0.innerHTML = `<summary>Cluster Mapping (Baseline → Generated) (${baselineClusters.length})</summary>`;
      const mapTable = document.createElement("table");
      mapTable.style.marginTop = "8px";
      mapTable.innerHTML = `
        <thead>
          <tr>
            <th>Baseline Cluster</th>
            <th>Generated Cluster(s)</th>
            <th>Jaccard(s)</th>
            <th>Overlap(s)</th>
            <th>Sizes (B/G)</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const mapBody = mapTable.querySelector("tbody");

      for (const b of baselineClusters) {
        const baseKeys = new Set(b.title_keys || []);
        const overlaps = [];
        for (const g of generatedClusters) {
          const genKeys = new Set(g.title_keys || []);
          const inter = [...baseKeys].filter((k) => genKeys.has(k));
          if (inter.length === 0) continue;
          const union = new Set([...baseKeys, ...genKeys]);
          const jaccard = union.size ? (inter.length / union.size) : 0;
          overlaps.push({
            id: g.id,
            titles: g.titles || [],
            overlapCount: inter.length,
            jaccard,
            generatedSize: genKeys.size,
          });
        }
        overlaps.sort((l, r) => {
          if (r.jaccard !== l.jaccard) return r.jaccard - l.jaccard;
          return r.overlapCount - l.overlapCount;
        });

        const baselineList = (b.titles || [])
          .map((t) => `<li>${String(t).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")}</li>`)
          .join("");
        const generatedClustersCell = overlaps.length
          ? overlaps.map((g) => {
              const generatedList = (g.titles || [])
                .map((t) => `<li>${String(t).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")}</li>`)
                .join("");
              return `<details><summary>${g.id}</summary><ul>${generatedList}</ul></details>`;
            }).join("")
          : "-";
        const jaccardCell = overlaps.length
          ? overlaps.map((g) => `${(g.jaccard * 100).toFixed(1)}%`).join("<br/>")
          : "0.0%";
        const overlapCell = overlaps.length
          ? overlaps.map((g) => String(g.overlapCount)).join("<br/>")
          : "0";
        const sizesCell = overlaps.length
          ? overlaps.map((g) => `${baseKeys.size} / ${g.generatedSize}`).join("<br/>")
          : `${baseKeys.size} / 0`;

        const r = document.createElement("tr");
        r.innerHTML = `
          <td>
            <details>
              <summary>${b.id}</summary>
              <ul>${baselineList}</ul>
            </details>
          </td>
          <td>${generatedClustersCell}</td>
          <td>${jaccardCell}</td>
          <td>${overlapCell}</td>
          <td>${sizesCell}</td>
        `;
        mapBody.appendChild(r);
      }
      d0.appendChild(mapTable);
      section.appendChild(d0);

      // Missing titles
      const missing = c.missing_titles || [];
      if (missing.length) {
        const d1 = document.createElement("details");
        d1.innerHTML = `<summary>Missing Titles (${missing.length})</summary>`;
        const ul1 = document.createElement("ul");
        for (const t of missing.slice(0, 40)) {
          const li = document.createElement("li");
          li.textContent = t;
          ul1.appendChild(li);
        }
        d1.appendChild(ul1);
        section.appendChild(d1);
      }

      // Extra titles
      const extra = c.extra_titles || [];
      if (extra.length) {
        const d2 = document.createElement("details");
        d2.innerHTML = `<summary>Extra Titles (${extra.length})</summary>`;
        const ul2 = document.createElement("ul");
        for (const t of extra.slice(0, 40)) {
          const li = document.createElement("li");
          li.textContent = t;
          ul2.appendChild(li);
        }
        d2.appendChild(ul2);
        section.appendChild(d2);
      }

      details.appendChild(section);
    }
  </script>
</body>
</html>
